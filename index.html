<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guild Management App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

  <div id="app" class="w-full flex flex-col items-center">
    <!-- UI will be rendered here by JavaScript -->
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-white text-center">
      <h3 class="text-xl font-bold mb-4">Confirm Deletion</h3>
      <p class="mb-6">Are you sure you want to delete this member? This action cannot be undone.</p>
      <div class="flex gap-4 justify-center">
        <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-lg font-semibold transition">Yes, Delete</button>
        <button id="cancel-delete-btn" class="bg-gray-600 hover:bg-gray-700 px-5 py-2 rounded-lg font-semibold transition">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    // Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, setLogLevel, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Log all Firebase debug messages to the console
    setLogLevel('debug');

    // Global variables provided by the Canvas environment for Firebase
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // State management for the app
    let members = [];
    let page = "members";
    let attendancePage = "nidavellir";
    let timeOfDay = null;
    let loading = true;
    let userId = null;
    let db = null;
    let auth = null;
    let attendance = {};
    let finalizedBosses = {};

    let currentEditId = null;
    let currentDeleteId = null;

    // Get a reference to the main app container
    const appContainer = document.getElementById('app');
    const deleteModal = document.getElementById('delete-modal');
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
    const cancelDeleteBtn = document.getElementById('cancel-delete-btn');

    // Function to re-render the app based on the current state
    function renderApp() {
      appContainer.innerHTML = '';
      if (loading) {
        appContainer.innerHTML = `<p class="text-xl font-semibold">Loading app and connecting to database...</p>`;
        return;
      }

      // Main Navigation Buttons
      const navHtml = `
        <div class="w-full max-w-6xl text-center mb-4">
          <p class="text-sm text-gray-400 mb-2">Current User ID: ${userId || 'N/A'}</p>
        </div>
        <div class="flex gap-4 mb-6 flex-wrap justify-center w-full max-w-xl">
          <button id="members-nav" class="px-6 py-3 rounded-lg font-semibold text-lg transition ${page === 'members' ? 'bg-purple-600 shadow-lg' : 'bg-gray-700 hover:bg-gray-600'}">Members</button>
          <button id="attendance-nav" class="px-6 py-3 rounded-lg font-semibold text-lg transition ${page === 'bossAttendance' ? 'bg-purple-600 shadow-lg' : 'bg-gray-700 hover:bg-gray-600'}">Boss Hunt Attendance</button>
        </div>
      `;
      appContainer.insertAdjacentHTML('beforeend', navHtml);

      // Add event listeners for navigation
      document.getElementById('members-nav').addEventListener('click', () => { page = 'members'; renderApp(); });
      document.getElementById('attendance-nav').addEventListener('click', () => { page = 'bossAttendance'; renderApp(); });

      // Render the current page
      if (page === 'members') {
        renderMemberManager();
      } else if (page === 'bossAttendance') {
        renderAttendancePageSelector();
      }
    }

    function renderMemberManager() {
      // Member Manager UI
      const sortedMembers = [...members].sort((a, b) => {
        if (a.playerClass === b.playerClass) return a.ign.localeCompare(b.ign);
        return a.playerClass.localeCompare(b.playerClass);
      });

      const classOptions = `
        <option value="" disabled selected>Select Class</option>
        <optgroup label="Healer">
          <option value="Saint">Saint</option>
          <option value="Paladin">Paladin</option>
        </optgroup>
        <optgroup label="Warrior">
          <option value="Defender">Defender</option>
          <option value="Berserker">Berserker</option>
        </optgroup>
        <optgroup label="Rogue">
          <option value="Assassin">Assassin</option>
          <option value="Sniper">Sniper</option>
        </optgroup>
        <optgroup label="Mage">
          <option value="Archmage">Archmage</option>
          <option value="Darkwiz">Darkwiz</option>
        </optgroup>
      `;

      const memberHtml = `
        <div class="space-y-6 flex flex-col items-center">
          <div class="bg-gray-800 text-white rounded-2xl shadow-lg p-8 w-full max-w-md">
            <h1 class="text-3xl font-bold text-center mb-6">⚔️ Reunion Guild Member Manager ⚔️</h1>
            <form id="member-form" class="space-y-4">
              <input name="ign" id="ign-input" placeholder="In-game Name (IGN)" class="w-full p-3 rounded-xl bg-gray-700 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500" required />
              <select name="playerClass" id="class-select" class="w-full p-3 rounded-xl bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                ${classOptions}
              </select>
              <div class="flex gap-2">
                <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-700 p-3 rounded-xl font-semibold transition" id="submit-btn">Add Member</button>
                <button type="button" class="bg-gray-600 hover:bg-gray-700 p-3 rounded-xl font-semibold transition" id="clear-btn">Clear</button>
              </div>
            </form>
            <div id="status-message" class="hidden mt-4 p-3 text-center rounded-xl bg-gray-700 text-white"></div>
          </div>

          <div class="bg-gray-800 text-white rounded-2xl shadow-lg p-6 w-full max-w-3xl">
            <h2 class="text-2xl font-bold mb-4">📜 Guild Members List (${members.length})</h2>
            <div id="members-list">
              ${members.length === 0 ? '<p class="text-gray-400 text-center">No members yet. Add some to get started!</p>' : `
                <div class="overflow-x-auto">
                  <table class="w-full border-collapse">
                    <thead>
                      <tr class="bg-gray-700">
                        <th class="p-3 border border-gray-600 text-left">IGN</th>
                        <th class="p-3 border border-gray-600 text-left">Class</th>
                        <th class="p-3 border border-gray-600 text-center">Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${sortedMembers.map(m => `
                        <tr class="hover:bg-gray-700">
                          <td class="p-3 border border-gray-600">${m.ign}</td>
                          <td class="p-3 border border-gray-600 ${getClassColor(m.playerClass)}">${m.playerClass}</td>
                          <td class="p-3 border border-gray-600 text-center">
                            <div class="flex gap-2 justify-center">
                              <button data-id="${m.id}" data-action="edit" class="bg-yellow-500 hover:bg-yellow-600 text-black px-3 py-1 rounded-lg transition">Edit</button>
                              <button data-id="${m.id}" data-action="delete" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg transition">Delete</button>
                            </div>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        </div>
      `;

      appContainer.insertAdjacentHTML('beforeend', memberHtml);

      const memberForm = document.getElementById('member-form');
      const ignInput = document.getElementById('ign-input');
      const classSelect = document.getElementById('class-select');
      const submitBtn = document.getElementById('submit-btn');
      const statusMessageEl = document.getElementById('status-message');

      function setStatus(message) {
        statusMessageEl.textContent = message;
        statusMessageEl.classList.remove('hidden');
      }

      function resetForm() {
        ignInput.value = '';
        classSelect.value = '';
        submitBtn.textContent = 'Add Member';
        currentEditId = null;
        statusMessageEl.classList.add('hidden');
      }

      memberForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!db) return;

        const ign = ignInput.value;
        const playerClass = classSelect.value;
        const memberData = { ign, playerClass };

        try {
          if (currentEditId) {
            await setDoc(doc(db, `artifacts/${appId}/public/data/guild_members`, currentEditId), memberData);
            setStatus("Member updated successfully!");
          } else {
            await addDoc(collection(db, `artifacts/${appId}/public/data/guild_members`), memberData);
            setStatus("Member added successfully!");
          }
          resetForm();
        } catch (error) {
          console.error("Error writing document: ", error);
          setStatus("Error: Could not save member.");
        }
      });

      document.getElementById('clear-btn').addEventListener('click', resetForm);

      document.getElementById('members-list').addEventListener('click', (e) => {
        const target = e.target;
        if (target.dataset.action === 'edit') {
          const memberId = target.dataset.id;
          const member = members.find(m => m.id === memberId);
          if (member) {
            ignInput.value = member.ign;
            classSelect.value = member.playerClass;
            submitBtn.textContent = 'Update Member';
            currentEditId = memberId;
          }
        } else if (target.dataset.action === 'delete') {
          currentDeleteId = target.dataset.id;
          deleteModal.classList.remove('hidden');
        }
      });
    }

    function renderAttendancePageSelector() {
      // Main boss type navigation
      const navHtml = `
        <div class="space-y-6 w-full max-w-6xl">
          <div class="flex gap-4 mb-6 flex-wrap justify-center">
            <button id="nav-nidavellir" class="px-4 py-2 rounded-lg font-semibold transition ${attendancePage === 'nidavellir' ? 'bg-purple-600' : 'bg-gray-700 hover:bg-gray-600'}">Nidavellir</button>
            <button id="nav-alfheim" class="px-4 py-2 rounded-lg font-semibold transition ${attendancePage === 'alfheim' ? 'bg-purple-600' : 'bg-gray-700 hover:bg-gray-600'}">Alfheim</button>
            <button id="nav-dungeons" class="px-4 py-2 rounded-lg font-semibold transition ${attendancePage === 'dungeons' ? 'bg-purple-600' : 'bg-gray-700 hover:bg-gray-600'}">Dungeons</button>
          </div>
          <div id="attendance-content"></div>
        </div>
      `;
      appContainer.insertAdjacentHTML('beforeend', navHtml);

      // Page-specific controls
      let pageSpecificControlsHtml = '';
      if (attendancePage === 'dungeons') {
        pageSpecificControlsHtml = `
          <div class="flex gap-4 mb-6 flex-wrap justify-center">
            <button id="nav-b7" class="px-4 py-2 rounded-lg font-semibold transition ${timeOfDay === 'B7' ? 'bg-orange-600' : 'bg-gray-700 hover:bg-gray-600'}">B7 - Slothful Draugr</button>
            <button id="nav-am" class="px-4 py-2 rounded-lg font-semibold transition ${timeOfDay === 'AM' ? 'bg-green-600' : 'bg-gray-700 hover:bg-gray-600'}">B4 - AM Bosses</button>
            <button id="nav-pm" class="px-4 py-2 rounded-lg font-semibold transition ${timeOfDay === 'PM' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}">B4 - PM Bosses</button>
          </div>
        `;
      } else if (attendancePage === 'nidavellir') {
        pageSpecificControlsHtml = `
          <div class="flex gap-4 mb-6 flex-wrap justify-center">
            <button id="nav-am" class="px-4 py-2 rounded-lg font-semibold transition ${timeOfDay === 'AM' ? 'bg-green-600' : 'bg-gray-700 hover:bg-gray-600'}">AM Bosses</button>
            <button id="nav-pm" class="px-4 py-2 rounded-lg font-semibold transition ${timeOfDay === 'PM' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}">PM Bosses</button>
          </div>
        `;
      }
      appContainer.querySelector('#attendance-content').insertAdjacentHTML('beforebegin', pageSpecificControlsHtml);

      // Add event listeners for navigation
      document.getElementById('nav-nidavellir').addEventListener('click', () => { attendancePage = 'nidavellir'; timeOfDay = null; renderApp(); });
      document.getElementById('nav-alfheim').addEventListener('click', () => { attendancePage = 'alfheim'; timeOfDay = null; renderApp(); });
      document.getElementById('nav-dungeons').addEventListener('click', () => { attendancePage = 'dungeons'; timeOfDay = null; renderApp(); });

      // Add event listeners for page-specific controls
      if (attendancePage === 'dungeons') {
        document.getElementById('nav-b7').addEventListener('click', () => { timeOfDay = 'B7'; renderApp(); });
        document.getElementById('nav-am').addEventListener('click', () => { timeOfDay = 'AM'; renderApp(); });
        document.getElementById('nav-pm').addEventListener('click', () => { timeOfDay = 'PM'; renderApp(); });
      } else if (attendancePage === 'nidavellir') {
        document.getElementById('nav-am').addEventListener('click', () => { timeOfDay = 'AM'; renderApp(); });
        document.getElementById('nav-pm').addEventListener('click', () => { timeOfDay = 'PM'; renderApp(); });
      }

      let bossesToRender = [];
      let pageTitle = '';

      if (attendancePage === 'nidavellir') {
        bossesToRender = ["Rhino (AM)", "Rhino (PM)", "Bjorn (AM)", "Bjorn (PM)", "Hermod (AM)", "Hermod (PM)", "Skalanir (AM)", "Skalanir (PM)", "Brynhild (AM)", "Brynhild (PM)", "Ratatoskr (AM)", "Ratatoskr (PM)", "Sudri (AM)", "Sudri (PM)"];
        pageTitle = '🐉 Nidavellir Boss Attendance';
      } else if (attendancePage === 'alfheim') {
        bossesToRender = ["Svart", "Durathor", "Mangarm", "Draugr", "Garmwalker"];
        pageTitle = '🐉 Alfheim Boss Attendance';
      } else if (attendancePage === 'dungeons') {
        bossesToRender = ["B4 - Wrathful Managarm (AM)", "B4 - Wrathful Managarm (PM)", "B7 - Slothful Draugr"];
        pageTitle = '🏰 Dungeon Boss Attendance';
      }

      renderAttendancePage(bossesToRender, pageTitle, timeOfDay);
    }
    
    function renderAttendancePage(bosses, title, timeFilter) {
      const attendanceContent = document.getElementById('attendance-content');
      let html = `<div class="bg-gray-800 text-white rounded-2xl shadow-lg p-8 w-full max-w-5xl">
        <h2 class="text-2xl font-bold mb-6">${title}</h2>`;

      const filteredBosses = bosses.filter(boss => {
        const isAm = boss.includes('(AM)');
        const isPm = boss.includes('(PM)');
        if (timeFilter === 'B7') return boss === "B7 - Slothful Draugr";
        if (timeFilter === 'AM') return isAm;
        if (timeFilter === 'PM') return isPm;
        return !(isAm || isPm);
      });

      // Sort members by class and IGN for consistent display
      const sortedMembers = [...members].sort((a, b) => {
        if (a.playerClass === b.playerClass) return a.ign.localeCompare(b.ign);
        return a.playerClass.localeCompare(b.playerClass);
      });

      if (members.length === 0) {
        html += `<p class="text-gray-400">No members to track. Add some on the Members page.</p>`;
      } else {
        html += filteredBosses.map(boss => {
          const attendedCount = Object.values(attendance[boss] || {}).filter(Boolean).length;
          const isFinalized = !!finalizedBosses[boss];
          const attendeesList = Object.entries(attendance[boss] || {}).filter(([_, v]) => v).map(([ign]) => ign).join(", ") || "No attendees";

          return `
            <div class="mb-6 bg-gray-700 rounded-xl p-4">
              <h4 class="text-xl font-bold mb-3">${boss} (Attended: ${attendedCount}/${members.length})</h4>
              <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                  <thead>
                    <tr class="bg-gray-600">
                      <th class="p-3 border border-gray-500 text-left">IGN</th>
                      <th class="p-3 border border-gray-500 text-left">Class</th>
                      <th class="p-3 border border-gray-500 text-center">Attended</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${sortedMembers.map(m => `
                      <tr class="hover:bg-gray-600">
                        <td class="p-3 border border-gray-500">${m.ign}</td>
                        <td class="p-3 border border-gray-500 ${getClassColor(m.playerClass)}">${m.playerClass}</td>
                        <td class="p-3 border border-gray-500 text-center">
                          <input type="checkbox" data-boss="${boss}" data-ign="${m.ign}"
                            ${isFinalized ? 'disabled' : ''}
                            ${attendance[boss]?.[m.ign] ? 'checked' : ''}
                            class="w-5 h-5 accent-purple-500 cursor-pointer disabled:cursor-not-allowed attendance-checkbox" />
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
              ${!isFinalized ? `
                <button data-boss="${boss}" data-action="finalize" class="mt-4 bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-semibold transition finalize-btn">Finalize ${boss}</button>
              ` : `
                <div class="mt-4 p-4 rounded-lg bg-gray-600">
                  <p class="font-semibold text-green-400 mb-2">✅ Finalized: Attendees (${attendedCount})</p>
                  <p class="text-sm text-gray-300">Finalized at: ${finalizedBosses[boss].time}</p>
                  <p class="text-sm text-gray-300 mt-1">${attendeesList}</p>
                  <button data-boss="${boss}" data-action="revert" class="mt-3 bg-yellow-500 hover:bg-yellow-600 px-4 py-2 rounded-lg text-black font-semibold transition revert-btn">Revert Finalization</button>
                </div>
              `}
            </div>
          `;
        }).join('');
      }
      
      html += `</div>`;
      attendanceContent.innerHTML = html;

      // Add event listeners for attendance checkboxes and buttons
      document.querySelectorAll('.attendance-checkbox').forEach(input => {
        input.addEventListener('change', async (e) => {
          const boss = e.target.dataset.boss;
          const ign = e.target.dataset.ign;
          const isAttending = e.target.checked;
          const newAttendance = { ...attendance[boss] || {}, [ign]: isAttending };
          const docRef = doc(db, `artifacts/${appId}/public/data/guild_attendance`, boss);
          try {
            await setDoc(docRef, { boss, attendees: newAttendance }, { merge: true });
          } catch (error) {
            console.error("Error updating attendance:", error);
          }
        });
      });

      document.querySelectorAll('.finalize-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const boss = btn.dataset.boss;
          const docRef = doc(db, `artifacts/${appId}/public/data/guild_attendance`, boss);
          try {
            await updateDoc(docRef, { finalized: new Date() });
          } catch (error) {
            console.error("Error finalizing boss:", error);
          }
        });
      });

      document.querySelectorAll('.revert-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const boss = btn.dataset.boss;
          const docRef = doc(db, `artifacts/${appId}/public/data/guild_attendance`, boss);
          try {
            await updateDoc(docRef, { finalized: null });
          } catch (error) {
            console.error("Error reverting finalization:", error);
          }
        });
      });
    }

    function getClassColor(cls) {
      switch (cls) {
        case "Saint": return "text-green-400 font-bold";
        case "Paladin": return "text-green-300 font-bold";
        case "Defender": return "text-blue-400 font-bold";
        case "Berserker": return "text-blue-300 font-bold";
        case "Assassin": return "text-red-400 font-bold";
        case "Sniper": return "text-red-300 font-bold";
        case "Archmage": return "text-purple-400 font-bold";
        case "Darkwiz": return "text-purple-300 font-bold";
        default: return "text-gray-300 font-bold";
      }
    }

    // Modal event listeners
    confirmDeleteBtn.addEventListener('click', async () => {
      if (!db || !currentDeleteId) return;
      try {
        await deleteDoc(doc(db, `artifacts/${appId}/public/data/guild_members`, currentDeleteId));
        deleteModal.classList.add('hidden');
        currentDeleteId = null;
      } catch (error) {
        console.error("Error removing document: ", error);
        // Maybe show an error message
      }
    });

    cancelDeleteBtn.addEventListener('click', () => {
      deleteModal.classList.add('hidden');
      currentDeleteId = null;
    });

    // Main initialization function
    async function initFirebase() {
      if (Object.keys(firebaseConfig).length === 0) {
        console.error("Firebase config is missing.");
        loading = false;
        renderApp();
        return;
      }

      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);

      try {
        if (initialAuthToken) {
          await signInWithCustomToken(auth, initialAuthToken);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Firebase auth failed:", error);
        await signInAnonymously(auth);
      }

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          userId = user.uid;

          // Check if the guild_members collection is empty and add sample members if it is
          const membersCollection = collection(db, `artifacts/${appId}/public/data/guild_members`);
          const membersSnapshot = await getDocs(membersCollection);

          if (membersSnapshot.empty) {
            console.log("Adding sample members to an empty database...");
            const sampleMembers = [
              // Saints
              { ign: "Celestial", playerClass: "Saint" },
              { ign: "Luminary", playerClass: "Saint" },
              // Paladins
              { ign: "Guardian", playerClass: "Paladin" },
              { ign: "Aegis", playerClass: "Paladin" },
              // Defenders
              { ign: "Bulwark", playerClass: "Defender" },
              { ign: "Shieldbreaker", playerClass: "Defender" },
              // Berserkers
              { ign: "Ragnarok", playerClass: "Berserker" },
              { ign: "Frenzied", playerClass: "Berserker" },
              // Assassins
              { ign: "Shadowstrike", playerClass: "Assassin" },
              { ign: "Viper", playerClass: "Assassin" },
              // Snipers
              { ign: "Hawkeye", playerClass: "Sniper" },
              { ign: "Sharpshooter", playerClass: "Sniper" },
              // Archmages
              { ign: "Arcane", playerClass: "Archmage" },
              { ign: "Sorcerer", playerClass: "Archmage" },
              // Darkwiz
              { ign: "Necromancer", playerClass: "Darkwiz" },
              { ign: "Voidcaller", playerClass: "Darkwiz" },
            ];

            for (const member of sampleMembers) {
              await addDoc(membersCollection, member);
            }
          }

          // Listen for real-time updates to members
          onSnapshot(membersCollection, (snapshot) => {
            members = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            loading = false;
            renderApp();
          });

          // Listen for real-time updates to attendance
          const attendanceCollection = collection(db, `artifacts/${appId}/public/data/guild_attendance`);
          onSnapshot(attendanceCollection, (snapshot) => {
            attendance = {};
            finalizedBosses = {};
            snapshot.docs.forEach(doc => {
              const data = doc.data();
              attendance[data.boss] = data.attendees || {};
              if (data.finalized) {
                finalizedBosses[data.boss] = { time: new Date(data.finalized.seconds * 1000).toLocaleString() };
              }
            });
            renderApp();
          });
        }
      });
    }

    // Start the application
    window.onload = initFirebase;
  </script>

</body>
</html>
